version: "3.8"

services:
  db:
    image: mysql:latest
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_DATABASE: library_automation_system
    ports:
      - "3307:3306"
    volumes:
      - mysql_vol:/var/lib/mysql

volumes:
  mysql_vol:
    driver: local

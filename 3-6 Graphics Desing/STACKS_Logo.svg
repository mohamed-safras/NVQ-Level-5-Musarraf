<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F3D2E"/>
      <stop offset="100%" stop-color="#142B20"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="48" fill="url(#bgGrad)"/>

  <!-- Open book / stacked shelf monogram -->
  <g transform="translate(300,255)">
    <!-- three stacked "book spine" bars forming an ascending stack -->
    <rect x="-140" y="60" width="280" height="34" rx="6" fill="#B8862E"/>
    <rect x="-115" y="10" width="230" height="34" rx="6" fill="#E0A83C"/>
    <rect x="-90" y="-40" width="180" height="34" rx="6" fill="#F1D488"/>
    <!-- open book arcs beneath, referencing a book viewed from above -->
    <path d="M -150,120 Q 0,170 150,120" stroke="#F1EEE2" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M -150,140 Q 0,190 150,140" stroke="#F1EEE2" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <text x="300" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#F1EEE2" letter-spacing="4">STACKS</text>
  <text x="300" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#B9C2AE" letter-spacing="6">LIBRARY AUTOMATION SYSTEM</text>
</svg>
